[workspace]
members = ["crates/cli", "crates/client"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/chaba2/textbin"

[workspace.metadata.dist]
allow-dirty = ["ci"]
cargo-dist-version = "0.31.0"
ci = "github"
github-release = "announce"
hosting = "github"
installers = ["shell", "powershell"]
packages = ["textbin"]
pr-run-mode = "upload"
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "x86_64-apple-darwin",
  "aarch64-apple-darwin",
  "x86_64-pc-windows-msvc",
]

[workspace.metadata.dist.github-custom-runners]
global = "blacksmith-2vcpu-ubuntu-2404"
x86_64-unknown-linux-gnu = "blacksmith-2vcpu-ubuntu-2404"
aarch64-unknown-linux-gnu = "blacksmith-2vcpu-ubuntu-2404-arm"
x86_64-apple-darwin = "blacksmith-6vcpu-macos-15"
aarch64-apple-darwin = "blacksmith-6vcpu-macos-15"
x86_64-pc-windows-msvc = "blacksmith-2vcpu-windows-2025"

[profile.dist]
inherits = "release"
lto = "thin"

[workspace.dependencies]
anyhow = "1.0.100"
base64 = "0.22.1"
clap = { version = "4.6.1", features = ["derive", "env"] }
directories = "6.0.0"
keyring = "4.1.5"
lumis = { version = "0.12.0", features = ["all-languages"] }
reqwest = { version = "0.12.24", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rpassword = "7.5.4"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
textbin-client = { path = "crates/client" }
toml = "0.9.8"
uuid = { version = "1.24.0", features = ["v4"] }
webbrowser = { version = "1.2.2", features = ["hardened"] }
