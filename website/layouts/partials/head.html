<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f7f4ec">
<meta name="description" content="{{ .Site.Params.description }}">
<meta property="og:title" content="{{ .Site.Title }} — A quieter place for working text">
<meta property="og:description" content="{{ .Site.Params.description }}">
<meta property="og:type" content="website">
<meta property="og:url" content="{{ .Permalink }}">
<link rel="canonical" href="{{ .Permalink }}">
<title>{{ .Site.Title }} — A quieter place for working text</title>
<link rel="icon" href="{{ "favicon.svg" | relURL }}" type="image/svg+xml">
{{ $style := resources.Get "css/main.css" | minify | fingerprint }}
<link rel="stylesheet" href="{{ $style.RelPermalink }}" integrity="{{ $style.Data.Integrity }}" crossorigin="anonymous">
