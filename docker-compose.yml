services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: kopynpaste_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kopynpaste_dev"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - kopynpaste

volumes:
  postgres-data:

networks:
  kopynpaste:
    driver: bridge
