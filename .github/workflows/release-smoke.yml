---
name: Release container smoke test

"on":
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  containers:
    name: Server container (${{ matrix.platform }})
    if: >-
      github.event.pull_request.base.ref == github.event.repository.default_branch &&
      github.event.pull_request.head.ref == 'release/next' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: blacksmith-2vcpu-ubuntu-2404
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]

    steps:
      - name: Checkout release candidate
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build server container
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          tags: textbin:release-smoke
          cache-from: type=gha,scope=release-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.platform }}

      - name: Verify container architecture and server version
        env:
          PLATFORM: ${{ matrix.platform }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [[ ! "$PR_TITLE" =~ ^chore\(release\):\ v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "::error::Invalid release PR title: $PR_TITLE"
            exit 1
          fi
          expected_version=${BASH_REMATCH[1]}
          expected_architecture=${PLATFORM#linux/}
          image_architecture=$(docker image inspect textbin:release-smoke --format '{{.Architecture}}')

          if [ "$image_architecture" != "$expected_architecture" ]; then
            echo "::error::Image architecture $image_architecture does not match $expected_architecture"
            exit 1
          fi

          server_version=$(
            docker run --rm --platform "$PLATFORM" \
              --entrypoint /app/bin/textbin \
              -e DATABASE_URL=ecto://postgres:postgres@localhost/textbin_release_smoke \
              -e PHX_HOST=localhost \
              -e SECRET_KEY_BASE="$(printf 'a%.0s' {1..64})" \
              textbin:release-smoke \
              eval 'IO.write(Application.spec(:textbin, :vsn))'
          )

          printf 'Platform: %s\nExpected: %s\nServer:   %s\n' \
            "$PLATFORM" "$expected_version" "$server_version"

          if [ "$server_version" != "$expected_version" ]; then
            echo "::error::Server version $server_version does not match release $expected_version"
            exit 1
          fi

  server-gate:
    name: Server release gate
    needs: containers
    if: always()
    runs-on: ubuntu-22.04

    steps:
      - name: Require both server architectures
        env:
          APPLICABLE: >-
            ${{ github.event.pull_request.base.ref == github.event.repository.default_branch &&
            github.event.pull_request.head.ref == 'release/next' &&
            github.event.pull_request.head.repo.full_name == github.repository }}
          CONTAINERS_RESULT: ${{ needs.containers.result }}
        run: |
          if [ "$APPLICABLE" != "true" ]; then
            echo "Server release checks do not apply to this pull request"
            exit 0
          fi

          if [ "$CONTAINERS_RESULT" != "success" ]; then
            echo "::error::Not every server container check succeeded: $CONTAINERS_RESULT"
            exit 1
          fi
