---
name: Release smoke test

"on":
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  artifacts:
    name: Verify CLI and server release versions
    if: >-
      github.event.pull_request.base.ref == github.event.repository.default_branch &&
      github.event.pull_request.head.ref == 'release/next' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: blacksmith-2vcpu-ubuntu-2404

    steps:
      - name: Checkout release candidate
        uses: actions/checkout@v4

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: "28.5"
          elixir-version: "1.20"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build CLI release artifact
        run: cargo build --release --package textbin

      - name: Build server release artifact
        env:
          MIX_ENV: prod
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get --only prod
          mix release

      - name: Verify embedded release versions
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [[ ! "$PR_TITLE" =~ ^chore\(release\):\ v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "::error::Invalid release PR title: $PR_TITLE"
            exit 1
          fi
          expected_version=${BASH_REMATCH[1]}

          cli_version=$(
            target/release/textbin --version |
              sed -nE 's/^textbin ([^[:space:]]+)$/\1/p'
          )
          if [ -z "$cli_version" ]; then
            echo "::error::Could not read the version from the CLI release artifact"
            exit 1
          fi

          server_version=$(
            elixir -e '
              [app_file] =
                Path.wildcard("_build/prod/rel/textbin/lib/textbin-*/ebin/textbin.app")

              {:ok, [{:application, :textbin, properties}]} =
                :file.consult(String.to_charlist(app_file))

              IO.write(to_string(Keyword.fetch!(properties, :vsn)))
            '
          )

          printf 'Expected: %s\nCLI:      %s\nServer:   %s\n' \
            "$expected_version" "$cli_version" "$server_version"

          if [ "$cli_version" != "$expected_version" ]; then
            echo "::error::CLI version $cli_version does not match release $expected_version"
            exit 1
          fi

          if [ "$server_version" != "$expected_version" ]; then
            echo "::error::Server version $server_version does not match release $expected_version"
            exit 1
          fi
